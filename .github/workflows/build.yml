name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --release -p victory

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows
          path: target/release/victory.exe
